; Old Man Weather firmware
; Board: Waveshare ESP32-S3-Touch-LCD-7B (ESP32-S3-WROOM-1-N16R8, 1024x600 RGB, GT911 touch)
;
; Build:   pio run
; Flash:   pio run -t upload            (USB, first time)
; OTA:     pio run -e station_ota -t upload   (over Wi-Fi / VPN once installed; set host + password below)
; Monitor: pio device monitor

[platformio]
default_envs = station

[env]
; pioarduino = Arduino-ESP32 3.3.x (ESP-IDF 5.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The bring-up board layer and its console are built ONLY by env:tdisplay.
; Production never compiles, links or references them. See docs/TEST_RIG.md.
build_src_filter = +<*> -<board_tdisplay.cpp> -<testrig.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"1.2.0\"
lib_deps =
    https://github.com/lvgl/lvgl.git#v8.3.11
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2

[env:station]

[env:station_ota]
upload_protocol = espota
; Change to the unit's hostname or VPN IP, e.g. oldmanweather-a1b2.local or 10.8.0.12
upload_port = oldmanweather.local
; Must match the maintenance password set during setup
upload_flags =
    --auth=CHANGE_ME
    --port=3232

; ---- Bring-up rig: LilyGO T-Display-S3 Touch ----------------------------------------
; NOT a product target, and it cannot leak into one: board_tdisplay.cpp and testrig.cpp
; are excluded from [env] above and guarded by #ifdef BOARD_TDISPLAY_S3, and no
; production file branches on that macro. The real 1024x600 UI renders into a PSRAM
; canvas and is shown scaled, or 1:1 with drag-to-pan.
;   pio run -e tdisplay -t upload && pio device monitor -e tdisplay
[env:tdisplay]
build_unflags = -DCORE_DEBUG_LEVEL=2
build_flags =
    ${env.build_flags}
    -DBOARD_TDISPLAY_S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=4
build_src_filter = +<*> -<board.cpp>
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
upload_speed = 921600
